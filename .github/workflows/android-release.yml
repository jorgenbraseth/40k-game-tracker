name: Build signed Android release bundle (and optionally upload to Google Play)

# Manual-dispatch-only, deliberately -- a real Play Store release should always be something you
# consciously trigger, never a side effect of merging to main (unlike deploy.yml's web pipeline).
#
# This needs the upload keystore (see android/keystore.properties.example) available in CI, which
# means it exists in GitHub Actions secrets rather than only on a developer's own machine -- a
# real trust trade-off, not a free upgrade over the local `npm run android:bundle` flow: the key
# now also depends on this repo's Actions configuration staying correctly scoped (no exposure to
# forked-PR workflows, which this repo doesn't use anyway) rather than only on physical access to
# one machine. Reasonable for a small solo project; revisit if that calculus ever changes. The
# keystore is decoded into place for this job only and deleted at the end, success or failure.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: ''
      versionName:
        description: 'User-visible version name (e.g. 1.1)'
        required: true
      track:
        description: 'Google Play track to upload to ("none" = only build the .aab as an Actions artifact)'
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production
        default: internal
      releaseStatus:
        # "draft" is the only status Play accepts while the app itself is still a draft (never
        # published to any track), and it's the safe default after that too: the release shows up
        # in Play Console for you to review and roll out by hand. "completed" rolls it out to the
        # whole track immediately; "inProgress" is a staged rollout (see userFraction).
        description: 'Play release status'
        type: choice
        options:
          - draft
          - completed
          - inProgress
        default: draft
      userFraction:
        description: 'Staged-rollout fraction, 0-1 exclusive (only used with releaseStatus=inProgress, e.g. 0.1)'
        required: false
        default: ''
      releaseNotes:
        description: 'Optional "What''s new" text (en-US) shown on the Play listing for this release'
        required: false
        default: ''

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Same environment as android-apk.yml/deploy.yml -- real VITE_SUPABASE_* secrets, and, if this
    # repo's "production" environment has required reviewers configured, that approval gate also
    # covers this workflow for free.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same as android-apk.yml -- ubuntu-latest already ships a fully licensed Android SDK.
      - name: Point Gradle at the preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "::warning::No sdkmanager found under \$ANDROID_HOME/cmdline-tools -- skipping the defensive license re-accept (harmless if licenses are already accepted, which they are on GitHub-hosted runners)."
          fi

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync into the native Android project
        run: npx cap sync android

      # Play rejects a re-upload with a versionCode <= one it's already seen, so this derives it
      # from the current UTC time instead of asking you to track and bump a number by hand.
      # yyMMddHH (hour granularity, e.g. 26092215 for 2026-09-22 15:00 UTC) rather than a full
      # timestamp: versionCode is a 32-bit int and Play caps it at 2,100,000,000, which a full
      # yyyyMMddHHmmss (14 digits) blows past outright and even yyMMddHHmm (10 digits) overflows
      # for any date after ~2021. A trailing serial digit (this workflow's own run_number mod 10)
      # covers the case of re-triggering a release within the same hour -- two runs only collide
      # if they land exactly 10 apart in this workflow's own run history, which a manual release
      # process is never going to hit. Nine digits total still maxes out at 991231239, comfortably
      # under the cap for the life of this app.
      - name: Compute versionCode
        id: version
        run: |
          TIMESTAMP=$(date -u +%y%m%d%H)
          SERIAL=$(( ${{ github.run_number }} % 10 ))
          echo "code=${TIMESTAMP}${SERIAL}" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release bundle
        working-directory: android
        run: ./gradlew bundleRelease -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ inputs.versionName }}

      - name: Remove signing key and keystore.properties
        # Always, even if the build above failed -- this job's workspace is thrown away either
        # way, but no reason to leave the decoded key sitting around mid-failure-diagnosis.
        if: always()
        run: rm -f android/upload-keystore.jks android/keystore.properties

      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: 40k-tracker-release-${{ inputs.versionName }}-${{ steps.version.outputs.code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # Everything below only runs when a Play track was picked -- track=none keeps the old
      # build-only behavior (download the .aab and upload it in Play Console by hand).
      #
      # Fail early with a readable message rather than letting the upload action error out on an
      # empty credential. Secrets can't be referenced in an `if:`, hence the env-var check here.
      - name: Check Play upload inputs
        if: inputs.track != 'none'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_STATUS: ${{ inputs.releaseStatus }}
          USER_FRACTION: ${{ inputs.userFraction }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set -- see docs/deployment.md (Uploading to Google Play). The signed .aab was still uploaded as an Actions artifact above."
            exit 1
          fi
          if [ "$RELEASE_STATUS" = "inProgress" ] && [ -z "$USER_FRACTION" ]; then
            echo "::error::releaseStatus=inProgress (staged rollout) needs a userFraction, e.g. 0.1."
            exit 1
          fi
          if [ "$RELEASE_STATUS" != "inProgress" ] && [ -n "$USER_FRACTION" ]; then
            echo "::error::userFraction only applies to releaseStatus=inProgress -- clear it or switch status."
            exit 1
          fi

      # upload-google-play reads release notes from files named whatsnew-<locale> in a directory.
      # Passed through env (not interpolated into the script) so arbitrary text in the input can't
      # break or inject into the shell.
      - name: Write release notes
        if: inputs.track != 'none' && inputs.releaseNotes != ''
        env:
          RELEASE_NOTES: ${{ inputs.releaseNotes }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"

      # Authenticates as a Google Cloud service account that's been granted release permissions on
      # this one app in Play Console -- see docs/deployment.md for the one-time setup. Note the
      # Play Developer API can't create an app or make its very first upload: the first .aab has
      # to be uploaded by hand in Play Console (download it from this run's artifacts) before this
      # step can work.
      - name: Upload to Google Play (${{ inputs.track }})
        if: inputs.track != 'none'
        # Pinned to a commit (v1.1.5) rather than a moving tag: this third-party action is handed
        # the Play publishing credential, so a retagged/compromised release shouldn't be picked up
        # silently. Bump deliberately.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fortyktracker.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.releaseStatus }}
          userFraction: ${{ inputs.userFraction }}
          releaseName: ${{ inputs.versionName }} (${{ steps.version.outputs.code }})
          whatsNewDirectory: ${{ inputs.releaseNotes != '' && format('{0}/whatsnew', runner.temp) || '' }}
