name: Build Android debug APK

# Runs automatically on every PR (so there's always a fresh sideloadable build to test against,
# without merging to main) and manually on any branch/tag/commit for out-of-band testing. Never
# touches deploy.yml's production pipeline -- Cloudflare Pages only ever redeploys from a push to
# `main`, which this workflow never pushes to.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: ''

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Same environment as deploy.yml -- needed for the real VITE_SUPABASE_URL/ANON_KEY below, so
    # the installed APK actually talks to the real backend instead of a build-only placeholder
    # (see ci.yml, which intentionally uses dummy values since it never ships its build output).
    # PRs from this repo's own branches (never forks, per this project's workflow) still get full
    # access to environment secrets on the `pull_request` trigger.
    environment: production
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's ubuntu-latest runners ship a fully licensed Android SDK already (at $ANDROID_HOME,
      # see https://github.com/actions/runner-images) -- no need to fetch or license a second one.
      # (This replaced android-actions/setup-android@v3, which failed here: it shells out to that
      # same preinstalled sdkmanager to re-accept licenses and errored doing so -- likely a version
      # mismatch between what the action expects and the cmdline-tools version this image ships.)
      - name: Point Gradle at the preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "::warning::No sdkmanager found under \$ANDROID_HOME/cmdline-tools -- skipping the defensive license re-accept (harmless if licenses are already accepted, which they are on GitHub-hosted runners)."
          fi

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync into the native Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: 40k-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Comment on PR with download link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- android-apk-comment -->'
            const shortSha = process.env.HEAD_SHA.slice(0, 7)
            const body = [
              marker,
              '### 🤖 Android debug APK',
              '',
              `Built from ${shortSha}. [Download the APK](${process.env.ARTIFACT_URL}) (GitHub sign-in required, expires after 14 days) -- unzip it and sideload onto a device to test.`,
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
