apply plugin: 'com.android.application'

// Release signing (issue #125). File-based, not properties baked into this build script: the
// upload keystore still never lives in this repo (android/.gitignore excludes it) -- for a local
// build it exists only on a developer's own machine (see keystore.properties.example); for
// android-release.yml (manual-dispatch-only, see that workflow's own comments on the trust
// trade-off of a keystore living in GitHub Actions secrets instead) it's decoded from a secret
// into this same keystore.properties shape for the duration of that one job, then deleted. Either
// way this file only ever reads keystore.properties -- it doesn't know or care which case it's in.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.fortyktracker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fortyktracker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects a re-upload with the same versionCode, so android-release.yml passes both
        // as -P Gradle properties per run instead of this needing a commit for every release;
        // local/debug builds (npm run android:bundle, android-apk.yml) get the fallback below.
        versionCode (project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1)
        versionName (project.hasProperty('versionName') ? project.property('versionName') : "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Without keystore.properties, `assembleDebug` (this repo's CI, android-apk.yml) is completely
// unaffected -- only an explicit `bundleRelease`/`assembleRelease` fails, with a clear reason
// instead of Gradle's own confusing "keystore not set" error.
if (!hasReleaseSigning) {
    tasks.matching { it.name in ['bundleRelease', 'assembleRelease'] }.configureEach {
        doFirst {
            throw new GradleException(
                "No android/keystore.properties found -- copy keystore.properties.example, point it at your " +
                "upload keystore (see issue #125), and re-run. assembleDebug/android-apk.yml are unaffected."
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
